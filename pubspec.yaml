name: suitapps
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:

  sdk: ^3.10.4

dependencies:
  flutter:
    sdk: flutter 

  url_launcher: ^6.3.0

  sqflite: ^2.4.2
  path: ^1.9.1
  image_picker: ^1.1.2
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  shared_preferences: ^2.2.3
  device_info_plus: ^10.1.0
  geolocator: ^13.0.1
  google_fonts: ^6.1.0
  geocoding: ^3.0.0
  intl: ^0.19.0
  fl_chart: ^0.68.0
  package_info_plus: ^8.0.0
  pdf: ^3.11.1
  printing: ^5.13.1
  share_plus: ^10.1.4
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:

  assets:
    - assets/images/sp-logo.png
    - assets/icon/sp-logo.png
    - assets/images/login-bg-1.jpg
    - assets/icon/app_icon.png
    - assets/images/splash_animation.gif
    - assets/images/gifloading.gif
    - assets/images/time.png
    - assets/images/phone.png
    - assets/images/compass.png


  uses-material-design: true

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/SP.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/SP.png"
